[package]
name = "unity-bundle-assets"
version = "0.1.1"
edition = "2021"
rust-version = "1.83"
description = "Read Unity serialized asset files and asset bundles, and export their sprites and textures as images, in pure Rust"
license = "MIT"
repository = "https://github.com/jtk18/unity-bundle-assets"
keywords = ["unity", "assetbundle", "sprite", "texture", "unityfs"]
categories = ["game-development", "parser-implementations", "multimedia::images"]
exclude = [".github", ".gitattributes", ".gitignore", "deny.toml"]

[package.metadata.docs.rs]
# Pure Rust with no platform code in the public API: one target's docs cover them all.
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
thiserror = "2"

[dev-dependencies]
# Builds LZMA blocks for the tests (its encoder writes literals only).
lzma-rs = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

# Each example runs its own tests on a small generated file under `cargo test`, so one that
# stops working fails the build (the helpers' tests in examples/common run with each).
[[example]]
name = "dump"
test = true

[[example]]
name = "export"
test = true

[[example]]
name = "list"
test = true

[[example]]
name = "survey"
test = true

[[example]]
name = "textures"
test = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Binary formats are all fixed-width integers and floats; each conversion is range-checked
# where the value comes from the file, and these lints cannot see that.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Parsers read one field after another; splitting them hides the layout.
too_many_lines = "allow"
# `mul_add` rounds differently from the engine and from UnityPy, whose output is the reference.
suboptimal_flops = "allow"
# Items inside private modules are `pub` or `pub(crate)` by what they are, not by where they
# are re-exported; the public API is exactly what lib.rs re-exports.
redundant_pub_crate = "allow"
