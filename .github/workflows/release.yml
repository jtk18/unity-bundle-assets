# Publish to crates.io when a version tag is pushed, and only then: this workflow has no
# other trigger. The tag must be `v` plus the version in Cargo.toml (`v0.1.0` for 0.1.0),
# point at a commit on `main`, and have a dated CHANGELOG entry; the crate must pass the same
# checks as a local release (format, lints, tests, docs, the minimum Rust version) first.
#
# Needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io API token with the
# publish-new and publish-update scopes).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.83 --profile minimal
          rustup default stable

      - name: Tag agrees with Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - name: CHANGELOG has a dated entry for this version
        run: |
          if ! grep -qE "^## ${VERSION//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a heading '## $VERSION (YYYY-MM-DD)'"
            exit 1
          fi

      - name: Format
        run: cargo fmt --check

      - name: Lints
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          rustup target add wasm32-unknown-unknown
          cargo clippy --locked --target wasm32-unknown-unknown --lib -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::all
        run: cargo doc --locked --no-deps

      - name: Minimum Rust version
        run: cargo +1.83 check --locked --lib

      - name: Package
        run: cargo publish --locked --dry-run

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
